# ═══════════════════════════════════════════════════════════════════
#  hxTP Embedded SDK — Unified CI/CD Pipeline
#
#  • Builds ESP32-S3 and ESP32 targets using PlatformIO
#  • Performs static analysis with arduino-lint and cppcheck
#  • Auto-releases to GitHub on tag push (v*) for Arduino Library Manager
#
#  Copyright (c) 2026 Hestia Labs
# ═══════════════════════════════════════════════════════════════════

name: Library Pipeline

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "platformio.ini"
            - "library.properties"
            - ".github/workflows/**"
        tags: ["v*"]
    pull_request:
        branches: [main]
        paths:
            - "src/**"
            - "platformio.ini"
            - "library.properties"
            - ".github/workflows/**"

jobs:
    # ── Build: ESP32-S3 (primary target) ─────────────────────────────
    build-esp32s3:
        name: Build ESP32-S3
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: hxtp-micro

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache PlatformIO packages
              uses: actions/cache@v4
              with:
                  path: ~/.platformio
                  key: ${{ runner.os }}-pio-esp32s3-${{ hashFiles('hxtp-micro/platformio.ini') }}
                  restore-keys: |
                      ${{ runner.os }}-pio-esp32s3-

            - name: Install PlatformIO Core
              run: pip install --quiet platformio

            - name: Compile for ESP32-S3
              run: cd hxtp-micro && pio run -e esp32s3

    # ── Build: ESP32-WROOM (tier-2 target) ───────────────────────────
    build-esp32:
        name: Build ESP32-WROOM
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: hxtp-micro

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache PlatformIO packages
              uses: actions/cache@v4
              with:
                  path: ~/.platformio
                  key: ${{ runner.os }}-pio-esp32-${{ hashFiles('hxtp-micro/platformio.ini') }}
                  restore-keys: |
                      ${{ runner.os }}-pio-esp32-

            - name: Install PlatformIO Core
              run: pip install --quiet platformio

            - name: Compile for ESP32-WROOM
              run: cd hxtp-micro && pio run -e esp32

    # ── Lint: Arduino Library Specification compliance ────────────
    lint:
        name: Arduino Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: hxtp-micro

            - name: Arduino Lint
              uses: arduino/arduino-lint-action@v2
              with:
                  path: hxtp-micro
                  compliance: strict
                  project-type: library

    # ── Static Analysis: cppcheck ────────────────────────────────────
    cppcheck:
        name: cppcheck Static Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: hxtp-micro

            - name: Install cppcheck
              run: sudo apt-get install -y --no-install-recommends cppcheck

            - name: Run cppcheck on HXTP library
              run: |
                  cppcheck \
                    --enable=warning,style,performance,portability \
                    --suppress=missingIncludeSystem \
                    --error-exitcode=1 \
                    --inline-suppr \
                    --std=c++17 \
                    -I hxtp-micro/src \
                    hxtp-micro/src/

    # ── Release ─────────
    release:
        name: Release
        needs: [build-esp32s3, build-esp32, lint, cppcheck]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  path: hxtp-micro

            - name: Extract version from tag
              id: version
              run: |
                  TAG="${{ github.ref }}"
                  VERSION="${TAG#refs/tags/v}"
                  NAME=$(grep '^name=' hxtp-micro/library.properties | cut -d= -f2)
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "name=$NAME" >> "$GITHUB_OUTPUT"
                  echo "Detected: $NAME v$VERSION from tag"

                  cd hxtp-micro
                  zip -r "../$NAME-$VERSION.zip" . -x ".git/*" ".github/*" ".vscode/*"
                  cd ..
                  ls -lh "$NAME-$VERSION.zip"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: "${{ steps.version.outputs.name }} ${{ steps.version.outputs.tag }}"
                  files: |
                      ${{ steps.version.outputs.name }}-${{ steps.version.outputs.version }}.zip
                  body: |
                      ## ${{ steps.version.outputs.name }} v${{ steps.version.outputs.version }}

                      Released for the [Arduino Library Manager](https://www.arduino.cc/reference/en/libraries/).

                      The Arduino Library Manager indexer checks for new releases every hour.
                      This version will be available for installation via **Sketch > Include Library > Manage Libraries...** shortly.

                      ### Install via Arduino CLI

                      ```bash
                      arduino-cli lib install "${{ steps.version.outputs.name }}"
                      ```

                      ### Install via PlatformIO

                      ```ini
                      lib_deps = ${{ steps.version.outputs.name }}
                      ```

                      ---
                      Commit: `${{ github.sha }}`
                  make_latest: true

            - name: Publish to PlatformIO Registry
              env:
                  PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
              run: |
                  cd hxtp-micro
                  pip install --quiet platformio
                  pio pkg publish --non-interactive
